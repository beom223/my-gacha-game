<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 칭호 & 인물 뽑기 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-wrapper">
        <!-- 메인 게임 영역 -->
        <div class="game-container">
            <h1>✨ 랜덤 칭호 수집하기 ✨</h1>
            <p class="subtitle">공용 칭호와 8인의 인물이 조합되어 뽑힙니다!</p>

            <!-- 뽑기 카드 표시 영역 -->
            <div class="card-container">
                <div class="card" id="card">
                    <div class="card-front" id="cardFront">
                        <span class="question-mark" id="cardIcon">❓</span>
                        <p id="drawText">Click Draw!</p>
                    </div>
                    <div class="card-back" id="cardBack">
                        <span class="badge" id="cardGrade">등급</span>
                        <div class="avatar" id="cardEmoji">👤</div>
                        <h2 id="cardTitle">칭호 + 이름</h2>
                        <p class="desc" id="cardDesc">설명</p>
                    </div>
                </div>
            </div>

            <!-- 버튼 영역 -->
            <div class="controls">
                <button id="drawBtn" onclick="drawSingle()">1회 뽑기</button>
                <button id="draw10Btn" onclick="drawTen()">10회 연사 뽑기</button>
            </div>

            <!-- 스탯 영역 -->
            <div class="stats">
                <p>총 뽑은 횟수: <span id="totalCount">0</span>회</p>
            </div>
        </div>

        <!-- 사이드 정보 영역 -->
        <div class="side-panel">
            <!-- 최고 기록 정보 -->
            <div class="info-box best-box">
                <h3>🏆 최고 획득 기록</h3>
                <div class="best-card-display" id="bestCardDisplay">
                    <span class="empty-msg">아직 뽑은 기록이 없습니다.</span>
                </div>
            </div>

            <!-- 등급별 확률 표 -->
            <div class="info-box">
                <h3>📊 등급별 확률</h3>
                <table class="prob-table">
                    <tr><th>등급</th><th>확률</th></tr>
                    <tr><td><span class="tag grade-mythic-tag">신화</span></td><td>2.0%</td></tr>
                    <tr><td><span class="tag grade-legendary-tag">전설</span></td><td>3.5%</td></tr>
                    <tr><td><span class="tag grade-epic-tag">영웅</span></td><td>12.0%</td></tr>
                    <tr><td><span class="tag grade-rare-tag">희귀</span></td><td>34.0%</td></tr>
                    <tr><td><span class="tag grade-common-tag">일반</span></td><td>48.5%</td></tr>
                </table>
            </div>

            <!-- 최근 뽑기 기록 -->
            <div class="info-box history">
                <h3>📜 최근 뽑기 기록</h3>
                <ul id="historyList"></ul>
            </div>
        </div>
    </div>

    <!-- 10연 뽑기 결과 모달 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>🎉 10연속 뽑기 결과 🎉</h2>
            <div id="modalGrid" class="modal-grid"></div>
            <button id="closeBtn" class="close-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
